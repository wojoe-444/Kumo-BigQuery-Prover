[project]
name = "kumo-bq-prover"
version = "0.0.1"
description = "Equivalence prover for BigQuery SQL only, with the BigQuery emulator as its execution oracle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot==30.21.0",
]

[project.optional-dependencies]
smt = [
    "z3-solver>=4.12,<6",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumo_bq_prover = ["untrusted_constructs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "emulator: needs the BigQuery emulator binary (run with: pytest -m emulator; fails, never skips, when the binary is missing)",
    "eval: scores the prover on a benchmark corpus",
]
addopts = "-m 'not emulator and not eval'"
